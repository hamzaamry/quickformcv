name: Deploy QuickFormCV to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 📋 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🌐 Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            echo "🔄 Starting deployment..."
          
            # Navigate to project directory
            cd ${{ secrets.PROJECT_PATH }}
          
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git pull origin main
          
            # Create backup of current database (optional)
            echo "💾 Creating database backup..."
            timestamp=$(date +%Y%m%d_%H%M%S)
            docker-compose -f docker-compose.prod.yml exec -T quickformcv-db pg_dump -U $POSTGRES_USER $POSTGRES_DB > "backup_${timestamp}.sql" 2>/dev/null || echo "⚠️  Backup skipped (database may not be running)"
          
            # Stop services
            echo "⏹️  Stopping services..."
            docker-compose -f docker-compose.prod.yml down
          
            # Pull latest images
            echo "🐳 Pulling latest Docker images..."
            docker-compose -f docker-compose.prod.yml pull
          
            # Build and start services
            echo "🔨 Building and starting services..."
            docker-compose -f docker-compose.prod.yml up -d --build
          
            # Clean up unused images and containers
            echo "🧹 Cleaning up..."
            docker system prune -f
          
            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 40
          
            echo "✅ Deployment completed!"
          ENDSSH

      - name: 🏥 Health Check
        run: |
          echo "🔍 Performing health check..."
          max_attempts=10
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."
          
            if curl -f -s http://${{ secrets.VPS_HOST }} > /dev/null; then
              echo "✅ Health check passed! Site is responding."
              exit 0
            else
              echo "❌ Health check failed. Retrying in 10 seconds..."
              sleep 10
              attempt=$((attempt + 1))
            fi
          done
          
          echo "💥 Health check failed after $max_attempts attempts!"
          exit 1

      - name: 📊 Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 Deployment successful! Your site is live at https://${{ secrets.VPS_HOST }}"
          else
            echo "💥 Deployment failed! Check the logs above for details."
          fi