services:
  db:
    image: postgres:15-alpine
    container_name: quickformcv-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: BMO
    ports:
      - "5432:5432"
    volumes:
      - quickformcv_postgres_data:/var/lib/postgresql/data
    networks:
      - quickformcv-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BMO"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  quickformcv-backend:
    build:
      context: ./quickformcv-backend
      dockerfile: Dockerfile
    container_name: quickformcv-backend
    ports:
      - "8000:8000"
    env_file:
      - ./quickformcv-backend/.env.local
    environment:
      - POSTGRES_SERVER=db
    depends_on:
      - db
    volumes:
      - ./quickformcv-backend/logs:/app/logs
      - ./quickformcv-backend/uploads:/app/uploads
      - ./quickformcv-backend/tmp:/app/tmp
    networks:
      - quickformcv-network
    restart: unless-stopped

  quickformcv-frontend:
    build:
      context: ./quickformcv-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v0
        - NEXT_PUBLIC_APP_URL=http://localhost:3000
        - NEXTAUTH_URL=http://localhost:3000
    container_name: quickformcv-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - quickformcv-backend
    volumes:
      - ./quickformcv-frontend/tmp:/app/tmp
    networks:
      - quickformcv-network
    restart: unless-stopped

volumes:
  quickformcv_postgres_data:
    driver: local

networks:
  quickformcv-network:
    driver: bridge
    name: quickformcv-dev-network