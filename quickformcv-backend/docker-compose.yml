services:
  quickformcv-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickformcv-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      # For development: mount local directories to persist data and logs
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./tmp:/app/tmp
    networks:
      - quickformcv-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: quickformcv-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - quickformcv_postgres_data:/var/lib/postgresql/data
    networks:
      - quickformcv-network
    restart: unless-stopped

volumes:
  quickformcv_postgres_data:
    driver: local

networks:
  quickformcv-network:
    driver: bridge
    name: quickformcv-network