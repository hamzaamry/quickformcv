services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: quickformcv-nginx-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - quickformcv-frontend
      - quickformcv-backend
    networks:
      - quickformcv-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  quickformcv-db:
    image: postgres:15-alpine
    container_name: quickformcv-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - quickformcv_postgres_data:/var/lib/postgresql/data
    networks:
      - quickformcv-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API
  quickformcv-backend:
    build:
      context: ./quickformcv-backend
      dockerfile: Dockerfile
    container_name: quickformcv-backend-prod
    # Remove ports exposure - only accessible through nginx
    environment:
      # Database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SERVER=quickformcv-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}

      # API Keys
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}

      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=https://quickformcv.com/api-server/api/v0/auth/callback

      # JWT
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}

      # URLs
      - FRONTEND_URL=https://quickformcv.com
      - API_BASE_URL=https://quickformcv.com/api-server

      # Production settings
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
    depends_on:
      - quickformcv-db
    volumes:
      - quickformcv_logs:/app/logs
      - quickformcv_uploads:/app/uploads
      - quickformcv_tmp:/app/tmp
    networks:
      - quickformcv-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend
  quickformcv-frontend:
    build:
      context: ./quickformcv-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://quickformcv.com/api-server/api/v0
        - NEXT_PUBLIC_APP_URL=https://quickformcv.com
        - NEXTAUTH_URL=https://quickformcv.com
    container_name: quickformcv-frontend-prod
    # Remove ports exposure - only accessible through nginx
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=https://quickformcv.com/api-server/api/v0  # Add this
      - NEXT_PUBLIC_APP_URL=https://quickformcv.com                    # Add this
      - NEXTAUTH_URL=https://quickformcv.com
    depends_on:
      - quickformcv-backend
    volumes:
      - quickformcv_frontend_tmp:/app/tmp
    networks:
      - quickformcv-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quickformcv_postgres_data:
    driver: local
  quickformcv_logs:
    driver: local
  quickformcv_uploads:
    driver: local
  quickformcv_tmp:
    driver: local
  quickformcv_frontend_tmp:
    driver: local
  nginx_logs:
    driver: local

networks:
  quickformcv-network:
    driver: bridge
    name: quickformcv-prod-network